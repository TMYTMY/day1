# Demo password stand-in for SSO. Replace authenticate() in src/auth.py
# before pointing this app at real data. Passwords here are local sample
# credentials, not production secrets. The Settings pages are not a substitute
# for that replacement: they are safe only on an instance that is not exposed
# to the public.
#
# Each role carries two grants: the tables it may read, and the capabilities
# it may run (an action such as query, alert, or admin). A role without a
# `capabilities` key implies `[query]`, which is what this file did before
# capabilities existed. The alert grant is deliberately narrow: only analyst
# may draft and confirm an alert definition, so the refusal a role without it
# receives stays testable. The admin grant is a separate decision: the owner
# role holds it and reads no tables.
#
# The owner account has no password here, and no password is documented
# anywhere. It signs in with the instance operator secret, which
# `python -m src.operator_secret --init` generates on this machine, prints
# once, and keeps only as a salted hash in the instance settings database
# (SETTINGS_PATH). A credential that grants admin and ships in the repository
# is a decorative gate: anyone who can read this file could repoint the SMTP
# host and have the stored mailbox password sent to a server of their choice.

roles:
  analyst:
    tables: [revenue, dau]
    capabilities: [query, alert]
  finance:
    tables: [revenue]
    capabilities: [query]
  growth:
    tables: [dau]
    capabilities: [query]
  owner:
    tables: []
    capabilities: [admin]

users:
  - username: analyst
    password: analyst
    role: analyst
  - username: finance
    password: finance
    role: finance
  - username: growth
    password: growth
    role: growth
  - username: owner
    role: owner
    credential: operator_secret
