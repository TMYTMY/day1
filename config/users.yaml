# Demo password stand-in for SSO. Replace authenticate() in src/auth.py
# before pointing this app at real data. Passwords here are local sample
# credentials, not production secrets.
#
# Each role carries two grants: the tables it may read, and the capabilities
# it may run (an action such as query). A role without a `capabilities` key
# implies `[query]`, which is what this file did before capabilities existed.

roles:
  analyst:
    tables: [revenue, dau]
    capabilities: [query]
  finance:
    tables: [revenue]
    capabilities: [query]
  growth:
    tables: [dau]
    capabilities: [query]

users:
  - username: analyst
    password: analyst
    role: analyst
  - username: finance
    password: finance
    role: finance
  - username: growth
    password: growth
    role: growth
